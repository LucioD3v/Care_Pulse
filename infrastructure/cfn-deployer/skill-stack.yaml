AWSTemplateFormatVersion: 2010-09-09
Parameters:
  SkillId:
    Type: String
  CareMode:
    Type: String
    Default: demo
    AllowedValues: [demo, production]
    Description: Use demo only with synthetic hackathon data.
  LambdaRuntime:
    Type: String
    Default: nodejs22.x
    AllowedValues:
      - nodejs22.x
      - nodejs24.x
    Description: Supported Lambda Node.js runtime (current AWS SDK requires Node.js 20 or newer).
  LambdaHandler:
    Type: String
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  CodeVersion:
    Type: String
  BedrockModelId:
    Type: String
    Default: ''
  BedrockResourceArns:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: '^$|^arn:[^:]+:bedrock:[^:]+:[0-9]*:(foundation-model|inference-profile|application-inference-profile)/[^*]+$'
Conditions:
  HasBedrock: !Not [!Equals [!Ref BedrockModelId, '']]
Resources:
  AlexaSkillIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: alexaSkillExecutionPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt CarePulseTable.Arn
                  - !Sub '${CarePulseTable.Arn}/index/*'
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt HealthMetricsTable.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref CaregiverAlertsTopic
              - !If
                - HasBedrock
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Ref BedrockResourceArns
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !GetAtt NotificationKey.Arn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub sns.${AWS::Region}.amazonaws.com
  AlexaSkillFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
        S3ObjectVersion: !Ref CodeVersion
      Handler: !Ref LambdaHandler
      Runtime: !Ref LambdaRuntime
      Role: !GetAtt AlexaSkillIAMRole.Arn
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          ALEXA_SKILL_ID: !Ref SkillId
          VOICE_TIMEOUT_MS: '1200'
          HEALTH_TABLE_NAME: !Ref HealthMetricsTable
          CARE_TABLE_NAME: !Ref CarePulseTable
          CARE_MODE: !Ref CareMode
          SNS_TOPIC_ARN: !Ref CaregiverAlertsTopic
          BEDROCK_MODEL_ID: !Ref BedrockModelId
  CarePulseTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: pendingPartition, AttributeType: S }
        - { AttributeName: dueAt, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: PendingFollowups
          KeySchema:
            - { AttributeName: pendingPartition, KeyType: HASH }
            - { AttributeName: dueAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: expiresAt, Enabled: true }
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
  HealthMetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: memberName
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: memberName
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  CaregiverAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: CarePulse caregiver alerts
      KmsMasterKeyId: !Ref NotificationKey
  NotificationKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'
  AlexaSkillFunctionEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:invokeFunction
      FunctionName: !GetAtt AlexaSkillFunction.Arn
      Principal: alexa-appkit.amazon.com
      EventSourceToken: !Ref SkillId
  AlexaSkillFunctionEventPermissionSmartHome:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:invokeFunction
      FunctionName: !GetAtt AlexaSkillFunction.Arn
      Principal: alexa-connectedhome.amazon.com
      EventSourceToken: !Ref SkillId
  AlexaSkillFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AlexaSkillFunction}
      RetentionInDays: 14
  AlexaSkillLogPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: carepulse-log-writer
      Roles: [!Ref AlexaSkillIAMRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt AlexaSkillFunctionLogGroup.Arn
Outputs:
  SkillEndpoint:
    Description: LambdaARN for the regional endpoint
    Value: !GetAtt AlexaSkillFunction.Arn
  CaregiverAlertsTopicArn:
    Description: Subscribe caregiver email or SMS endpoints to this SNS topic.
    Value: !Ref CaregiverAlertsTopic
