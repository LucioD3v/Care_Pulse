service: carepulse-mvp
frameworkVersion: '4'
configValidationMode: error

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ${opt:region, env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 15
  logRetentionInDays: 14
  deploymentMethod: direct
  versionFunctions: false
  environment:
    CARE_TABLE_NAME:
      Ref: CarePulseTable
    STAGE: ${sls:stage}
    CARE_MODE: ${param:careMode, env:CARE_MODE, 'demo'}
    WELLNESS_RETENTION_DAYS: ${param:wellnessRetentionDays, env:WELLNESS_RETENTION_DAYS, '90'}
    DEFAULT_MEMBER_NAME: ${param:defaultMemberName, env:DEFAULT_MEMBER_NAME, 'Elena'}
    DEFAULT_CAREGIVER_NAME: ${param:defaultCaregiverName, env:DEFAULT_CAREGIVER_NAME, 'Laura'}
    DEFAULT_BASELINE_SLEEP_HOURS: ${param:baselineSleepHours, env:DEFAULT_BASELINE_SLEEP_HOURS, ''}
    DEFAULT_TIME_ZONE: ${param:timeZone, env:DEFAULT_TIME_ZONE, 'America/Mexico_City'}
    DEMO_OWNER_ID: ${param:demoOwnerId, env:DEMO_OWNER_ID, ''}
  tags:
    Project: CarePulse
    Component: AlexaMVP
  stackTags:
    Project: CarePulse
    ManagedBy: ServerlessFramework

package:
  individually: true
  patterns:
    - '!**'

functions:
  alexaSkill:
    name: carepulse-${sls:stage}-alexa-skill
    description: CarePulse voice-first family wellness orchestration MVP
    handler: lambda/index.handler
    role: { Fn::GetAtt: [AlexaRole, Arn] }
    environment:
      ALEXA_SKILL_ID: ${param:alexaSkillId, env:ALEXA_SKILL_ID}
      SNS_TOPIC_ARN: { Ref: CaregiverAlertsTopic }
      BEDROCK_MODEL_ID: ${param:bedrockModelId, env:BEDROCK_MODEL_ID, ''}
      VOICE_TIMEOUT_MS: ${param:voiceTimeoutMs, env:VOICE_TIMEOUT_MS, '1200'}
    package:
      patterns:
        - lambda/**
        - '!lambda/test/**'
        - '!lambda/seed_demo.js'
        - '!lambda/backfill_followup_index.js'
        - '!**/.env*'
    events:
      - alexaSkill:
          appId: ${param:alexaSkillId, env:ALEXA_SKILL_ID}
          enabled: true

  mcpGateway:
    name: carepulse-${sls:stage}-mcp-gateway
    description: CarePulse MCP 2025-11-25 JSON Streamable HTTP gateway
    handler: lambda/mcp_http.handler
    role: { Fn::GetAtt: [McpRole, Arn] }
    # Alexa+ requires MCP round trips under 500 ms. Lambda CPU scales with memory, and provisioned
    # concurrency keeps initialized environments ready so cold starts stay off the request path.
    # Provisioned concurrency is billed while enabled; set it to 1 for demos and judging, 0 otherwise.
    memorySize: ${param:mcpMemorySize, env:MCP_MEMORY_SIZE, 1024}
    provisionedConcurrency: ${param:mcpProvisionedConcurrency, env:MCP_PROVISIONED_CONCURRENCY, 0}
    environment:
      MCP_API_KEY: ${param:mcpApiKey, env:MCP_API_KEY, env:CAREPULSE_MCP_KEY}
      MCP_ALLOWED_ORIGINS: ${param:mcpAllowedOrigins, env:MCP_ALLOWED_ORIGINS, ''}
      SNS_TOPIC_ARN: { Ref: CaregiverAlertsTopic }
    package:
      patterns:
        - lambda/**
        - '!lambda/test/**'
        - '!lambda/seed_demo.js'
        - '!lambda/backfill_followup_index.js'
        - '!**/.env*'
    events:
      - httpApi:
          path: /mcp
          method: POST
      - httpApi:
          path: /mcp
          method: DELETE
      - httpApi:
          path: /mcp
          method: GET

  followupMonitor:
    name: carepulse-${sls:stage}-followup-monitor
    handler: lambda/followup_monitor.handler
    role: { Fn::GetAtt: [MonitorRole, Arn] }
    timeout: 60
    package:
      patterns:
        - lambda/**
        - '!lambda/test/**'
        - '!lambda/seed_demo.js'
        - '!lambda/backfill_followup_index.js'
        - '!**/.env*'
    events:
      - schedule: rate(5 minutes)

resources:
  Parameters:
    BedrockInvokeResources:
      Type: CommaDelimitedList
      Default: ${param:bedrockResourceArns, env:BEDROCK_RESOURCE_ARNS, ''}
      AllowedPattern: '^$|^arn:[^:]+:bedrock:[^:]+:[0-9]*:(foundation-model|inference-profile|application-inference-profile)/[^*]+$'
    OperationsAlarmTopicArn:
      Type: String
      Default: ${param:operationsAlarmTopicArn, env:OPERATIONS_ALARM_TOPIC_ARN, ''}
  Conditions:
    HasBedrock: { Fn::Not: [{ Fn::Equals: ["${param:bedrockModelId, env:BEDROCK_MODEL_ID, ''}", ''] }] }
    HasAlarmTopic: { Fn::Not: [{ Fn::Equals: [{ Ref: OperationsAlarmTopicArn }, ''] }] }
  Resources:
    CarePulseTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: carepulse-${sls:stage}-care-state
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: pendingPartition
            AttributeType: S
          - AttributeName: dueAt
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: PendingFollowups
            KeySchema:
              - AttributeName: pendingPartition
                KeyType: HASH
              - AttributeName: dueAt
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        SSESpecification:
          SSEEnabled: true
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        Tags:
          - Key: DataClassification
            Value: SensitiveWellnessData

    CaregiverAlertsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: carepulse-${sls:stage}-caregiver-alerts
        DisplayName: CarePulse check-ins
        KmsMasterKeyId: { Ref: NotificationKey }

    NotificationKey:
      Type: AWS::KMS::Key
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        EnableKeyRotation: true
        KeyPolicy:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { AWS: { Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' } }
              Action: 'kms:*'
              Resource: '*'
    AlexaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: AlexaRolePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/carepulse-${sls:stage}-alexa-skill:*
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
                  Resource:
                    - { Fn::GetAtt: [CarePulseTable, Arn] }
                - Effect: Allow
                  Action: sns:Publish
                  Resource: { Ref: CaregiverAlertsTopic }
                - Effect: Allow
                  Action: [kms:GenerateDataKey, kms:Decrypt]
                  Resource: { Fn::GetAtt: [NotificationKey, Arn] }
                  Condition:
                    StringEquals:
                      kms:ViaService: { Fn::Sub: 'sns.${AWS::Region}.amazonaws.com' }
                - Fn::If:
                    - HasBedrock
                    - Effect: Allow
                      Action: bedrock:InvokeModel
                      Resource: { Ref: BedrockInvokeResources }
                    - { Ref: 'AWS::NoValue' }
    McpRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: McpRolePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/carepulse-${sls:stage}-mcp-gateway:*
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
                  Resource:
                    - { Fn::GetAtt: [CarePulseTable, Arn] }
                - Effect: Allow
                  Action: sns:Publish
                  Resource: { Ref: CaregiverAlertsTopic }
                - Effect: Allow
                  Action: [kms:GenerateDataKey, kms:Decrypt]
                  Resource: { Fn::GetAtt: [NotificationKey, Arn] }
                  Condition:
                    StringEquals:
                      kms:ViaService: { Fn::Sub: 'sns.${AWS::Region}.amazonaws.com' }
    MonitorRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: MonitorRolePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/carepulse-${sls:stage}-followup-monitor:*
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:Query]
                  Resource:
                    - { Fn::GetAtt: [CarePulseTable, Arn] }
                    - { Fn::Sub: "${CarePulseTable.Arn}/index/PendingFollowups" }
    AlexaLatencyAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: RequestDuration
        Dimensions:
          - Name: Service
            Value: alexa
          - Name: Stage
            Value: ${sls:stage}
        ExtendedStatistic: p95
        Period: 60
        EvaluationPeriods: 1
        Threshold: 3000
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    McpLatencyAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: MCP p95 handler time is near the Alexa+ 500 ms round-trip limit.
        Namespace: CarePulse
        MetricName: RequestDuration
        Dimensions:
          - Name: Service
            Value: mcp
          - Name: Stage
            Value: ${sls:stage}
        ExtendedStatistic: p95
        Period: 300
        EvaluationPeriods: 1
        Threshold: 400
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    AlexaNotificationAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: NotificationFailures
        Dimensions:
          - Name: Service
            Value: alexa
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    McpNotificationAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: NotificationFailures
        Dimensions:
          - Name: Service
            Value: mcp
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    AlexaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: RequestErrors
        Dimensions:
          - Name: Service
            Value: alexa
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    McpErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: ServiceErrors
        Dimensions:
          - Name: Service
            Value: mcp
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    OverdueFollowupsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: OldestOverdueAge
        Dimensions:
          - Name: Service
            Value: monitor
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 86400
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    McpToolErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: ToolErrors
        Dimensions:
          - Name: Service
            Value: mcp
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    MonitorErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: carepulse-${sls:stage}-followup-monitor
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]

  Outputs:
    AlexaLambdaArn:
      Description: Paste this ARN into the Alexa custom skill endpoint configuration.
      Value:
        Fn::GetAtt: [AlexaSkillLambdaFunction, Arn]
    McpEndpoint:
      Description: MCP 2025-11-25 Streamable HTTP JSON endpoint.
      Value:
        Fn::Join:
          - ''
          - - Fn::GetAtt: [HttpApi, ApiEndpoint]
            - /mcp
    CarePulseTableName:
      Description: DynamoDB table containing care context, events, follow-ups, and consent records.
      Value:
        Ref: CarePulseTable
    CaregiverAlertsTopicArn:
      Description: Subscribe the authorized demo caregiver to this topic with AWS CLI.
      Value:
        Ref: CaregiverAlertsTopic
