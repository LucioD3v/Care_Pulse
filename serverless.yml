service: carepulse-mvp
frameworkVersion: '4'
configValidationMode: error
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ${opt:region, env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 15
  logRetentionInDays: 14
  deploymentMethod: direct
  versionFunctions: false
  environment:
    CARE_TABLE_NAME:
      Ref: CarePulseTable
    STAGE: ${sls:stage}
    CARE_MODE: ${param:careMode, env:CARE_MODE, 'demo'}
    WELLNESS_RETENTION_DAYS: ${param:wellnessRetentionDays, env:WELLNESS_RETENTION_DAYS, '90'}
    DEFAULT_MEMBER_NAME: ${param:defaultMemberName, env:DEFAULT_MEMBER_NAME, 'Elena'}
    DEFAULT_CAREGIVER_NAME: ${param:defaultCaregiverName, env:DEFAULT_CAREGIVER_NAME, 'Laura'}
    DEFAULT_BASELINE_SLEEP_HOURS: ${param:baselineSleepHours, env:DEFAULT_BASELINE_SLEEP_HOURS, ''}
    DEFAULT_TIME_ZONE: ${param:timeZone, env:DEFAULT_TIME_ZONE, 'America/Mexico_City'}
    DEMO_OWNER_ID: ${param:demoOwnerId, env:DEMO_OWNER_ID, ''}
    SNS_TOPIC_ARN:
      Ref: CaregiverAlertsTopic
    BEDROCK_MODEL_ID: ${env:CAREPULSE_BEDROCK_MODEL_ID}
    REQUIRE_BEDROCK: 'true'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [CarePulseTable, Arn]
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            Ref: CaregiverAlertsTopic
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource: '*'
  tags:
    Project: CarePulse
    Component: AlexaMVP
  stackTags:
    Project: CarePulse
    ManagedBy: ServerlessFramework

package:
  individually: false
  patterns:
    - '!**'
    - lambda/**
    - '!lambda/test/**'
    - '!lambda/seed_demo.js'
    - '!lambda/backfill_followup_index.js'
    - '!**/.env*'

functions:
  alexaSkill:
    name: carepulse-${sls:stage}-alexa-skill
    description: CarePulse voice-first family wellness orchestration MVP
    handler: lambda/index.handler
    role: { Fn::GetAtt: [AlexaRole, Arn] }
    environment:
      CAREPULSE_ALEXA_SKILL_ID: ${param:alexaSkillId, env:CAREPULSE_ALEXA_SKILL_ID}
      CAREPULSE_COVER_IMAGE_URL: ${param:coverImageUrl, env:CAREPULSE_COVER_IMAGE_URL, ''}
      CAREPULSE_CARD_SMALL_IMAGE_URL: ${param:cardSmallImageUrl, env:CAREPULSE_CARD_SMALL_IMAGE_URL, ''}
      CAREPULSE_CARD_LARGE_IMAGE_URL: ${param:cardLargeImageUrl, env:CAREPULSE_CARD_LARGE_IMAGE_URL, ''}
      CAREPULSE_WELLNESS_BACKGROUND_URL: ${param:wellnessBackgroundUrl, env:CAREPULSE_WELLNESS_BACKGROUND_URL, ''}
      SNS_TOPIC_ARN: { Ref: CaregiverAlertsTopic }
      BEDROCK_MODEL_ID: ${param:bedrockModelId, env:CAREPULSE_BEDROCK_MODEL_ID, ''}
      VOICE_TIMEOUT_MS: ${param:voiceTimeoutMs, env:VOICE_TIMEOUT_MS, '1200'}
    events:
      - alexaSkill:
          appId: ${param:alexaSkillId, env:CAREPULSE_ALEXA_SKILL_ID}
          enabled: true

  mcpGateway:
    name: carepulse-${sls:stage}-mcp-gateway
    description: CarePulse MCP 2025-11-25 JSON Streamable HTTP gateway
    handler: lambda/mcp_http.handler
    role: { Fn::GetAtt: [McpRole, Arn] }
    environment:
      MCP_API_KEY: ${param:mcpApiKey, env:MCP_API_KEY, env:CAREPULSE_MCP_KEY}
      MCP_ALLOWED_ORIGINS: ${param:mcpAllowedOrigins, env:MCP_ALLOWED_ORIGINS, ''}
      SNS_TOPIC_ARN: { Ref: CaregiverAlertsTopic }
      # Alexa+ add-on OAuth: Cognito issues tokens; oauth_endpoints.js publishes discovery metadata.
      MCP_JWT_ISSUER: { Fn::Sub: 'https://cognito-idp.${AWS::Region}.amazonaws.com/${McpUserPool}' }
      MCP_JWKS_URI: { Fn::Sub: 'https://cognito-idp.${AWS::Region}.amazonaws.com/${McpUserPool}/.well-known/jwks.json' }
      MCP_JWT_CLIENT_IDS: { Ref: McpAlexaClient }
      COGNITO_DOMAIN_URL: { Fn::Sub: 'https://${McpUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com' }
      MCP_OAUTH_SCOPES: carepulse/access
      MCP_RESOURCE_URL: ${param:mcpResourceUrl, env:MCP_RESOURCE_URL, ''}
      OAUTH_ISSUER_URL: ${param:oauthIssuerUrl, env:OAUTH_ISSUER_URL, ''}
      # Demo mode: the only Cognito "sub" allowed to act for DEMO_OWNER_ID. Empty disables token access.
      DEMO_TOKEN_SUBJECT: ${param:demoTokenSubject, env:DEMO_TOKEN_SUBJECT, ''}
    events:
      - httpApi:
          path: /mcp
          method: POST
      - httpApi:
          path: /mcp
          method: DELETE
      - httpApi:
          path: /mcp
          method: GET
      - httpApi:
          path: /.well-known/oauth-protected-resource
          method: GET
      - httpApi:
          path: /.well-known/oauth-protected-resource/mcp
          method: GET
      - httpApi:
          path: /.well-known/oauth-authorization-server
          method: GET
      - httpApi:
          path: /oauth/authorize
          method: GET
      - httpApi:
          path: /oauth/token
          method: POST

  followupMonitor:
    name: carepulse-${sls:stage}-followup-monitor
    handler: lambda/followup_monitor.handler
    role: { Fn::GetAtt: [MonitorRole, Arn] }
    timeout: 60
    events:
      - schedule: rate(5 minutes)

resources:
  Parameters:
    BedrockInvokeResources:
      Type: CommaDelimitedList
      Default: ${param:bedrockResourceArns, env:BEDROCK_RESOURCE_ARNS, ''}
      AllowedPattern: '^$|^arn:[^:]+:bedrock:[^:]+:[0-9]*:(foundation-model|inference-profile|application-inference-profile)/[^*]+$'
    OperationsAlarmTopicArn:
      Type: String
      Default: ${param:operationsAlarmTopicArn, env:OPERATIONS_ALARM_TOPIC_ARN, ''}
  Conditions:
    HasBedrock: { Fn::Not: [{ Fn::Equals: ["${param:bedrockModelId, env:BEDROCK_MODEL_ID, ''}", ''] }] }
    HasAlarmTopic: { Fn::Not: [{ Fn::Equals: [{ Ref: OperationsAlarmTopicArn }, ''] }] }
  Resources:
    McpUserPool:
      Type: AWS::Cognito::UserPool
      # A replaced pool issues new user IDs (sub) and breaks DEMO_TOKEN_SUBJECT and Alexa+ account linking.
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        UserPoolName: carepulse-${sls:stage}-alexa-plus
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: true
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: true
    McpUserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        UserPoolId: { Ref: McpUserPool }
        Domain: { Fn::Sub: 'carepulse-${sls:stage}-${AWS::AccountId}' }
    McpResourceServer:
      Type: AWS::Cognito::UserPoolResourceServer
      Properties:
        UserPoolId: { Ref: McpUserPool }
        Identifier: carepulse
        Name: CarePulse MCP
        Scopes:
          - ScopeName: access
            ScopeDescription: Use CarePulse wellness tools for the linked account
    McpAlexaClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn: McpResourceServer
      Properties:
        UserPoolId: { Ref: McpUserPool }
        ClientName: carepulse-${sls:stage}-alexa-plus
        GenerateSecret: true
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows: [code]
        AllowedOAuthScopes: [carepulse/access]
        SupportedIdentityProviders: [COGNITO]
        # Replace with the redirect URIs that "alexa-ai configure-account-linking" prints, then redeploy.
        # Separate them with commas and no spaces; CloudFormation cannot trim them.
        CallbackURLs:
          Fn::Split: [',', "${param:alexaRedirectUris, env:ALEXA_REDIRECT_URIS, 'https://localhost/alexa-redirect-pending'}"]
        PreventUserExistenceErrors: ENABLED
        EnableTokenRevocation: true
        AccessTokenValidity: 60
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          RefreshToken: days
    CarePulseTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: carepulse-${sls:stage}-care-state
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: pendingPartition
            AttributeType: S
          - AttributeName: dueAt
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: PendingFollowups
            KeySchema:
              - AttributeName: pendingPartition
                KeyType: HASH
              - AttributeName: dueAt
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        SSESpecification:
          SSEEnabled: true
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        Tags:
          - Key: DataClassification
            Value: SensitiveWellnessData

    CaregiverAlertsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: carepulse-${sls:stage}-caregiver-alerts
        DisplayName: CarePulse check-ins
        KmsMasterKeyId: { Ref: NotificationKey }

    NotificationKey:
      Type: AWS::KMS::Key
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        EnableKeyRotation: true
        KeyPolicy:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { AWS: { Fn::Sub: 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' } }
              Action: 'kms:*'
              Resource: '*'
    AlexaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: AlexaRolePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/carepulse-${sls:stage}-alexa-skill:*
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
                  Resource:
                    - { Fn::GetAtt: [CarePulseTable, Arn] }
                - Effect: Allow
                  Action: sns:Publish
                  Resource: { Ref: CaregiverAlertsTopic }
                - Effect: Allow
                  Action: [kms:GenerateDataKey, kms:Decrypt]
                  Resource: { Fn::GetAtt: [NotificationKey, Arn] }
                  Condition:
                    StringEquals:
                      kms:ViaService: { Fn::Sub: 'sns.${AWS::Region}.amazonaws.com' }
                - Fn::If:
                    - HasBedrock
                    - Effect: Allow
                      Action: bedrock:InvokeModel
                      Resource: { Ref: BedrockInvokeResources }
                    - { Ref: 'AWS::NoValue' }
    McpRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: McpRolePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/carepulse-${sls:stage}-mcp-gateway:*
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
                  Resource:
                    - { Fn::GetAtt: [CarePulseTable, Arn] }
                - Effect: Allow
                  Action: sns:Publish
                  Resource: { Ref: CaregiverAlertsTopic }
                - Effect: Allow
                  Action: [kms:GenerateDataKey, kms:Decrypt]
                  Resource: { Fn::GetAtt: [NotificationKey, Arn] }
                  Condition:
                    StringEquals:
                      kms:ViaService: { Fn::Sub: 'sns.${AWS::Region}.amazonaws.com' }
    MonitorRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        Policies:
          - PolicyName: MonitorRolePolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/carepulse-${sls:stage}-followup-monitor:*
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:Query]
                  Resource:
                    - { Fn::GetAtt: [CarePulseTable, Arn] }
                    - { Fn::Sub: "${CarePulseTable.Arn}/index/PendingFollowups" }
    AlexaLatencyAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: RequestDuration
        Dimensions:
          - Name: Service
            Value: alexa
          - Name: Stage
            Value: ${sls:stage}
        ExtendedStatistic: p95
        Period: 60
        EvaluationPeriods: 1
        Threshold: 3000
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    AlexaNotificationAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: NotificationFailures
        Dimensions:
          - Name: Service
            Value: alexa
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    McpNotificationAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: NotificationFailures
        Dimensions:
          - Name: Service
            Value: mcp
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    AlexaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: RequestErrors
        Dimensions:
          - Name: Service
            Value: alexa
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    McpErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: ServiceErrors
        Dimensions:
          - Name: Service
            Value: mcp
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    OverdueFollowupsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: OldestOverdueAge
        Dimensions:
          - Name: Service
            Value: monitor
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 86400
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    McpToolErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: CarePulse
        MetricName: ToolErrors
        Dimensions:
          - Name: Service
            Value: mcp
          - Name: Stage
            Value: ${sls:stage}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]
    MonitorErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: carepulse-${sls:stage}-followup-monitor
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          Fn::If: [HasAlarmTopic, [{ Ref: OperationsAlarmTopicArn }], { Ref: 'AWS::NoValue' }]

  Outputs:
    McpProtectedResourceMetadataUrl:
      Description: Alexa+ discovers the OAuth server from this document.
      Value:
        Fn::Join:
          - ''
          - - Fn::GetAtt: [HttpApi, ApiEndpoint]
            - /.well-known/oauth-protected-resource
    McpOAuthClientId:
      Description: Pass to "alexa-ai configure-account-linking --client-id". Read the secret from the Cognito console.
      Value: { Ref: McpAlexaClient }
    McpUserPoolId:
      Description: Create the demo sign-in user here (admin-created users only).
      Value: { Ref: McpUserPool }
    AlexaLambdaArn:
      Description: Paste this ARN into the Alexa custom skill endpoint configuration.
      Value:
        Fn::GetAtt: [AlexaSkillLambdaFunction, Arn]
    McpEndpoint:
      Description: MCP 2025-11-25 Streamable HTTP JSON endpoint.
      Value:
        Fn::Join:
          - ''
          - - Fn::GetAtt: [HttpApi, ApiEndpoint]
            - /mcp
    CarePulseTableName:
      Description: DynamoDB table containing care context, events, follow-ups, and consent records.
      Value:
        Ref: CarePulseTable
    CaregiverAlertsTopicArn:
      Description: Subscribe the authorized demo caregiver to this topic with AWS CLI.
      Value:
        Ref: CaregiverAlertsTopic
