name: CarePulse validation
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: lambda/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix lambda
      - name: Run all suites
        run: npm test --prefix lambda
      - name: Install production dependencies
        run: npm ci --omit=dev --prefix lambda
      - name: Package Lambda
        run: python3 scripts/package_lambda.py lambda carepulse-lambda.zip
      - name: Verify packaged entry points
        run: |
          mkdir /tmp/carepulse-artifact
          unzip -q carepulse-lambda.zip -d /tmp/carepulse-artifact
          node -e "for (const name of ['index', 'mcp_http', 'followup_monitor', 'aws-services']) require('/tmp/carepulse-artifact/' + name)"
      - uses: actions/upload-artifact@v4
        with:
          name: carepulse-lambda
          path: carepulse-lambda.zip
